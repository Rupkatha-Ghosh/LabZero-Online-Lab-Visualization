services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: labzero
      POSTGRES_USER: labzero
      POSTGRES_PASSWORD: labzero
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U labzero -d labzero"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: 
      context: ./Backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./Backend:/app
    environment:
      - DEBUG=1
      - DATABASE_URL=postgresql://labzero:labzero@db:5432/labzero
    env_file:
      - ./Backend/.env
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"

  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    volumes:
      - ./Frontend:/app
      # This anonymous volume prevents local node_modules from overwriting container's
      - /app/node_modules
    depends_on:
      - backend
    command: npm run dev -- --host

volumes:
  postgres_data:
